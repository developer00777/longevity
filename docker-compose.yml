# ── Longevity & Wellness Platform ─────────────────────────────────────────────
# Single docker-compose for the full stack.
#
# Services:
#   nginx   → Public entry point on port 80
#             /        → mobile web (Expo web build)
#             /admin   → admin dashboard (Vite build)
#   mobile  → Expo web, served by nginx inside container on :8081
#   admin   → React+Vite admin, served by nginx inside container on :3000
#
# Supabase is cloud-hosted — no local DB container needed.
# All secrets are read from .env at the monorepo root.
#
# Usage:
#   docker-compose up --build          # first run (builds images)
#   docker-compose up -d               # detached
#   docker-compose down                # stop
#   docker-compose logs -f mobile      # stream logs

services:

  # ── Mobile Web (Expo) ───────────────────────────────────────────────────────
  mobile:
    build:
      context: .
      dockerfile: apps/mobile/Dockerfile
      args:
        EXPO_PUBLIC_SUPABASE_URL: ${EXPO_PUBLIC_SUPABASE_URL}
        EXPO_PUBLIC_SUPABASE_ANON_KEY: ${EXPO_PUBLIC_SUPABASE_ANON_KEY}
        EXPO_PUBLIC_AGORA_APP_ID: ${EXPO_PUBLIC_AGORA_APP_ID:-}
        EXPO_PUBLIC_FCM_SENDER_ID: ${EXPO_PUBLIC_FCM_SENDER_ID:-}
        EXPO_PUBLIC_SENTRY_DSN: ${EXPO_PUBLIC_SENTRY_DSN:-}
        EXPO_PUBLIC_APP_ENV: ${EXPO_PUBLIC_APP_ENV:-production}
    container_name: longevity-mobile
    restart: unless-stopped
    expose:
      - "8081"
    networks:
      - longevity
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8081"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── Admin Dashboard (React + Vite) ──────────────────────────────────────────
  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
        VITE_AGORA_APP_ID: ${VITE_AGORA_APP_ID:-}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
        VITE_APP_ENV: ${VITE_APP_ENV:-production}
        VITE_BASE_URL: /admin
    container_name: longevity-admin
    restart: unless-stopped
    expose:
      - "3000"
    networks:
      - longevity
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── Nginx Reverse Proxy ─────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: longevity-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      mobile:
        condition: service_healthy
      admin:
        condition: service_healthy
    networks:
      - longevity
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  longevity:
    driver: bridge
